<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The one idea, as a mark: a warm surface that is allowed to drift, a dark deep
    that is not permitted to lie, and the line between them. Amber over navy,
    split by the cool boundary. No letters, no cleverness — just the line.
  -->
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" />
    </clipPath>
    <linearGradient id="dawn" x1="256" y1="36" x2="256" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0b048" stop-opacity="0.6" />
      <stop offset="0.7" stop-color="#e8a020" stop-opacity="0.12" />
      <stop offset="1" stop-color="#e8a020" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <!-- The void -->
    <rect width="512" height="512" fill="#0a1120" />
    <!-- The shown surface, allowed to drift -->
    <rect width="512" height="512" fill="url(#dawn)" />
    <!-- The boundary — the one cool line -->
    <rect x="88" y="228" width="336" height="24" rx="12" fill="#6a93f0" opacity="0.22" />
    <rect x="96" y="234" width="320" height="11" rx="5.5" fill="#8bb0f7" />
  </g>
</svg>
